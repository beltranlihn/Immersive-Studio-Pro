<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immersive Studio Pro</title>
<style>
  /* self-hosted fonts (no Google Fonts CDN — the packaged .exe works fully offline) */
  /* Geist is the single UI family; Inter is kept only as a fallback + for user text-clip content */
  @font-face{font-family:'Geist';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/geist-400.woff2') format('woff2');}
  @font-face{font-family:'Geist';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/geist-500.woff2') format('woff2');}
  @font-face{font-family:'Geist';font-style:normal;font-weight:600;font-display:swap;src:url('assets/fonts/geist-600.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url('assets/fonts/inter-latin.woff2') format('woff2');}
</style>
<style>
  /* [U-04] design tokens — single source for the monochrome ramp (bg → surface → ink) */
  /* ===== [R102·D-T1] Sistema de diseño. Cada valor tiene fuente — ver PROPUESTA-DISENO-UI.md =====
     SUPERFICIES: 3, no 6. Medido: toda referencia (Ableton/Premiere/Blender/Unreal, capturadas a resolución
     nativa) tiene UNA superficie dominante con 30–54% del área; la nuestra mandaba solo en el 26% porque
     repartíamos en seis. M3 define 5 roles y no los usa adyacentes. Pasos de 4–5 L* (Spectrum envía ΔL* 2.8–4.9).
     NEUTRAS: las cuatro referencias envían grises neutros; nuestro tinte azul sesga el juicio de color, que es
     justo lo que esta herramienta existe para hacer.
     NO las aclaramos a #121212 (regla de Material): medido, Premiere —el análogo correcto, es vídeo— está en
     L*=10.8 y nosotros en 8.2. Un entorno oscuro alrededor del visor está justificado. Ableton (22.6) y
     Blender (26.7) son más claros porque no juzgan imagen.
     La DIRECCIÓN del contraste es la affordance (Blender): botón = s2 (más claro que el panel);
     campo editable = s0 (más oscuro). Sin bordes, sin iconos. */
  :root{
    --s0:#111111;  /* L* 5.1  — pozos: fondo de app, campo de timeline, inputs editables */
    --s1:#1B1B1B;  /* L* 9.8  — paneles: LA superficie dominante (Premiere: 10.8) */
    --s2:#262626;  /* L* 15.2 — elevado: botones, chips, cabeceras */
    /* TINTAS. WCAG miente en oscuro: var(--ink-2) pasaba AA (4.22) con APCA Lc −38 = "aviso de copyright".
       Objetivo real: ≥7:1 y |Lc|≥60 (M3 apunta a 7:1 —AAA— para texto primario en oscuro). */
    --ink:#E0E0E0;      /* primario    Lc −85..−87 */
    --ink-2:#B8B8B8;    /* secundario  Lc −61..−64 */
    --ink-3:#8C8C8C;    /* NO es texto de cuerpo: Lc −38. Solo marcas de regla, sufijos de unidad */
    --ink-dim:#6D6D6D;  /* deshabilitado Lc −23..−26 */
    /* LÍNEAS: 3 alfas, no 10. Nadie distingue 0.08 de 0.09. M3: separador decorativo objetivo 1:1;
       borde con significado 3:1. */
    --line-soft:rgba(255,255,255,0.05);   /* divisor decorativo */
    --line:rgba(255,255,255,0.10);        /* borde con significado */
    --line-strong:rgba(255,255,255,0.16); /* foco / selección */
    /* ACENTOS: presupuesto = 2, y está escrito. Live se diseñó a dos colores; el tercero "muddies the
       waters". Eric Carl (Principal Designer, Ableton) lo defendió y PERDIÓ internamente — la disciplina
       solo aguanta si es una regla, no un gusto. Añadir un tercero exige cambiar este comentario. */
    --auto-live:#4FC3E8;  /* cian  = vivo / arrastrable */
    --auto-ovr:#E5B567;   /* ámbar = anulado */
    --danger:#E06C6C;  /* [REDISEÑO Rev1] danger un poco más saturado (era #D98A8A) */
    /* ESTADO. Un toggle encendido NO es una superficie más: es estado, así que no cuenta contra el tope de 3.
       Resolve lo dice dos veces en su manual ("Light gray when turned on, dark gray when turned off"):
       el encendido se lee por VALOR, no por color — la saturación se reserva para significado. */
    --state-on:#4A4A4A;    /* L* 30.7 — claramente por encima de s2 (15.2): "encendido" inconfundible */
    --state-hover:#303030; /* L* 19.9 — ΔL* 4.7 sobre s2. Blender: "strong mouse hover highlights can be very
                              flashy and cause distracting visual noise" → perceptible, nunca estroboscópico.
                              Tampoco cuenta contra el tope de 3: es estado, no nivel. */
    /* ESPACIADO: paleta CERRADA = intersección exacta de Spectrum + Primer + Atlassian. 2 y 6 son legales
       (los tres los envían como tokens con nombre). No hay escotilla: si un valor no está aquí, no existe. */
    --sp-2:2px; --sp-4:4px; --sp-6:6px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-20:20px; --sp-24:24px; --sp-32:32px;
    /* Alias heredados → colapsan los 6 grises viejos sobre las 3 superficies reales.
       Mapeados por lo que CADA UNO hace realmente, no por su nombre:
         bg-0 (badges, .track, inputs) y bg-1 (.app, .mid) = pozos          → s0
         bg-2 (.mtile, .ruler, .zoomgrp) y surface (.top, .vptool) = paneles → s1
         surface-2 (.seg, .ibtn) = botones                                   → s2
         surface-3 = SOLO hover → state-hover (colapsarlo a s2 dejaba el hover invisible: mismo color
                     que el botón en reposo. Lo cazó la aserción "hover != reposo"). */
    --bg-0:var(--s0); --bg-1:var(--s0); --bg-2:var(--s1);
    --surface:var(--s1); --surface-2:var(--s2); --surface-3:var(--state-hover);
    --ink-faint:var(--ink-2); /* LEVANTADO: 26 usos que eran texto real a Lc −38 */
    /* ===== [REDISEÑO Rev1] tokens nuevos — la paleta de superficies del editor ya coincidía (s0/s1/s2/state-on/hover);
       esto agrega lo que faltaba: pozo profundo, toggle verde, azul reactivo y el SISTEMA DE COLOR POR PARÁMETRO. ===== */
    --well-deep:#0A0B0C;   /* pozo más profundo que s0 (launcher gradient / campos hundidos) */
    --toggle-on:#4A8D6F;   /* switch encendido = verde (distinto de --state-on gris de segmentados/botones) */
    --react-blue:#7FB2E8;  /* audio / reactivo */
    --bar:#242424;         /* [AUDITORÍA Rev1] superficie del TRANSPORT. Verificado contra el prototipo: sólo el
                              transport lleva #242424; la top bar y el status van en #1B1B1B (--surface). */
    /* color por parámetro: mismo hue en el fader, el diamante de keyframe y la curva de automatización del timeline */
    --p-az:#E0954B;   /* Azimuth / X   */  --p-el:#D8C24B;   /* Elevation / Y */
    --p-size:#E0645C; /* Size / Scale  */  --p-rot:#C58BD0;  /* Rotation     */
    --p-op:#7FB2E8;   /* Opacity       */  --p-exp:#E8C84B;  /* Exposure     */
    --p-sat:#D06FB0;  /* Saturation    */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Geist','Inter',-apple-system,system-ui,sans-serif;background:var(--bg-1);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:11px;letter-spacing:-0.003em;overflow:hidden;user-select:none;}
  .tnum{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;} /* [U-39] ex .mono — it never was monospaced, it's Geist + tabular numerals */
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-corner{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:2px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22);}
  /* slim monochrome range sliders (FOV / dolly / volume / etc.) — match the .prow fader look */
  input[type=range]{-webkit-appearance:none;appearance:none;height:12px;background:transparent;cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--bg-0);box-shadow:inset 0 1px 2px rgba(0,0,0,0.55);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;background:var(--ink);border:none;margin-top:-4px;box-shadow:0 1px 2px rgba(0,0,0,0.5);}
  input[type=range]:hover::-webkit-slider-thumb{background:#FFFFFF;}
  button{font-family:inherit;color:inherit;padding:0;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:1.5px solid var(--ink-2);outline-offset:1px;}
  [tabindex]:focus-visible{outline:1px solid var(--ink-2);outline-offset:-1px;} /* [R94-UT5·U-10b] inset ring for keyboard-focused clips / track headers */
  button:disabled{opacity:.4;cursor:not-allowed;} /* [R94-UT5·U-30] real disabled buttons look disabled everywhere (matches .dis) */
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.99);}to{opacity:1;transform:none;}}
  @keyframes overIn{from{opacity:0;}to{opacity:1;}}

  .app{display:flex;flex-direction:column;height:100vh;width:100vw;background:var(--bg-1);}
  /* [boot] hide the editor chrome until app.js mounts the splash → no flash of the editor while the HTML paints before the script runs (body stays dark). Overlays live outside #app so they're unaffected. */
  body.preboot #app{visibility:hidden;}
  /* top bar */
  .top{height:28px;flex-shrink:0;display:flex;align-items:center;gap:var(--sp-8);padding:0 10px;background:var(--surface);border-bottom:.5px solid rgba(255,255,255,0.09);} /* [AUDITORÍA Rev1] el prototipo pone la TOP bar en #1B1B1B (sólo el transport va en --bar) */
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-2);flex-shrink:0;}
  /* [U-18] segmented controls — ONE canonical look (surface-2 · border rgba .1 · radius 2). Variant rules below keep ONLY real size/padding differences. */
  .seg,.vseg,.filtseg,.editseg,.groupseg,.seg2{background:var(--surface-2);border:.5px solid rgba(255,255,255,0.1);border-radius:3px;}
  .seg,.vseg,.filtseg,.editseg,.groupseg{display:inline-flex;align-items:stretch;height:18px;overflow:hidden;}
  .seg button,.vseg button,.filtseg button,.editseg button,.groupseg button{display:inline-flex;align-items:center;gap:var(--sp-6);padding:0 9px;font-size:11px;font-weight:500;border:none;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s;}
  .seg button+button,.vseg button+button,.filtseg button+button,.editseg button+button,.groupseg button+button{border-left:.5px solid rgba(255,255,255,0.1);}
  .seg button:hover,.vseg button:hover,.filtseg button:hover,.editseg button:hover,.groupseg button:hover{background:var(--surface-3);}
  .seg button.on,.vseg button.on,.filtseg button.on,.editseg button.on,.groupseg button.on,.seg2 button.on,.kindseg button.on{background:var(--state-on);color:var(--ink);}
  .chip{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;}

  /* body wrappers: default = stagecol fills; tall-inspector mode moves #inspPane beside stagecol so it spans full height */
  .bodyrow{flex:1;min-height:0;display:flex;}
  .stagecol{flex:1;min-width:0;display:flex;flex-direction:column;}
  .mid{flex:1;min-height:0;display:flex;background:var(--bg-1);}
  aside{display:flex;flex-direction:column;background:var(--bg-2);}
  .panhead{height:28px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--s0);border-bottom:.5px solid rgba(0,0,0,0.45);} /* [AUDITORÍA Rev1] 26→28: altura de barra del diseño (headers de Media e Inspector) */
  .pantab{display:flex;align-items:center;gap:6px;height:18px;padding:0 6px;background:transparent;border:none;border-radius:2px;}
  .pantab .ttl{font-size:11px;font-weight:600;letter-spacing:-0.008em;color:var(--ink-2);}
  .countbadge{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;font-weight:500;color:var(--ink-faint);background:var(--bg-0);padding:1px 5px;border-radius:2px;}
  .ibtn{width:22px;height:22px;display:grid;place-items:center;border-radius:2px;border:.5px solid rgba(255,255,255,0.09);background:var(--surface-2);color:var(--ink-2);cursor:pointer;transition:background .14s,transform .1s;} /* [U-20] 22² hit target (same icon, more inner padding) */
  .ibtn:hover{background:var(--surface-3);} .ibtn:active{transform:scale(.9);}
  .ibtn.flat{border:none;background:transparent;color:var(--ink-2);} .ibtn.flat:hover{color:var(--ink);} .ibtn.flat.on{color:var(--ink);}
  .gutter{width:5px;flex-shrink:0;cursor:col-resize;background:transparent;margin:0 -2.5px;z-index:8;}
  .gutter:hover{background:rgba(255,255,255,0.18);}

  /* [REDISEÑO Rev1] "well" = segmentado hundido (List/Grid, filtros, tabs del inspector, tabs de tipo del launcher) */
  .well{display:inline-flex;align-items:stretch;gap:2px;padding:2px;height:22px;box-sizing:border-box;background:var(--s2);border:.5px solid rgba(255,255,255,0.1);border-radius:3px;flex-shrink:0;}
  .well button{display:grid;place-items:center;height:16px;padding:0 7px;border:none;border-radius:2px;background:transparent;color:var(--ink-2);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;}
  .well button:hover:not(.on){color:var(--ink);}
  .well button.on{background:var(--state-on);color:var(--ink);}
  /* [REDISEÑO Rev1] botón de "crear" en la fila de acciones del panel Media (icon + label); .pri = Import (primario) */
  .crbtn{display:inline-flex;align-items:center;gap:5px;height:16px;padding:0 7px;border-radius:3px;border:.5px solid rgba(255,255,255,0.09);background:var(--s2);color:var(--ink-2);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap;}
  .crbtn:hover{background:var(--state-hover);color:var(--ink);}
  .crbtn.pri{border-color:rgba(255,255,255,0.2);background:var(--state-on);color:var(--ink);} .crbtn.pri:hover{background:#565656;color:#fff;}
  .crbtn.dis{opacity:.45;cursor:default;} .crbtn.dis:hover{background:var(--s2);color:var(--ink-2);}
  .crrow{container-type:inline-size;} .crlbl{display:none;} /* label oculto por defecto (panel angosto) */
  @container (min-width:322px){ .crlbl{display:inline;} } /* al ensanchar el panel, aparecen los labels de la Create row */
  /* [AUDITORÍA Rev1] campo de búsqueda de media: oculto hasta que Ctrl+F lo revela (.show) */
  .mediasearch{display:none;flex:1;min-width:0;height:22px;background:var(--s0);border:.5px solid rgba(255,255,255,0.12);border-radius:3px;color:var(--ink);font-family:inherit;font-size:11px;padding:0 8px;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,0.5);}
  .mediasearch::placeholder{color:var(--ink-3);}
  .mediasearch:focus{border-color:rgba(255,255,255,0.28);}
  .mediasearch.show{display:block;}
  .mediasearch.show ~ #mediaSortBtn{margin-left:6px;}
  /* [REDISEÑO Rev1] disparador de dropdown (Sort media, Output…): pill 22px con label + chevron */
  .ddbtn{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:3px;border:.5px solid rgba(255,255,255,0.09);background:var(--s2);color:var(--ink-2);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;flex-shrink:0;transition:background .12s,color .12s;}
  .ddbtn:hover{background:var(--state-hover);color:var(--ink);}
  /* media */
  .toolrow{display:flex;align-items:center;gap:var(--sp-8);flex-shrink:0;border-bottom:.5px solid rgba(255,255,255,0.05);}
  /* [R102·D-T1] 20px, no 18: es la altura de control de Blender ("Widget unit is 20 pixels at 1X scale") y a
     11px el texto necesita 15px de interlineado — a 18 se recortaba. El fondo s0 (más oscuro que el panel) ES
     la affordance de "esto se edita"; el botón hace lo contrario y va a s2. */
  .searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:var(--sp-6);height:20px;padding:0 var(--sp-8);border-radius:2px;background:var(--s0);border:.5px solid var(--line-soft);box-shadow:inset 0 1px 2px rgba(0,0,0,0.3);}
  .searchbox input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:11px;}
  .filtseg{flex-shrink:0;} /* [U-18] look shared with .seg */
  .filtseg button{padding:0 7px;display:grid;place-items:center;}
  .medialist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:5px 6px 12px;}
  .grphead{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:2px;cursor:default;color:var(--ink-2);}
  .grphead:hover{background:rgba(255,255,255,0.04);}
  .mitem{display:flex;align-items:center;gap:var(--sp-8);padding:5px 7px;margin-bottom:1px;border-radius:2px;cursor:grab;transition:background .12s;}
  .mitem:hover{background:rgba(255,255,255,0.04);}
  .mitem.sel{background:rgba(201,205,211,0.14);box-shadow:inset 0 0 0 1px rgba(201,205,211,0.55);}
  /* [R102·D-T2] SELECCIÓN EN DOS NIVELES. El tema de Ableton envía `Selection` y `StandbySelection` como
     colores DISTINTOS (fondo y primer plano), y repite el patrón para los resultados de búsqueda. Motivo:
     con tres paneles compitiendo por el foco (medios · línea de tiempo · inspector), si "seleccionado aquí" y
     "seleccionado allí" se ven igual, el usuario no sabe sobre qué van a actuar el teclado o el próximo comando.
     Nosotros lo colapsábamos en uno solo.
     Base = STANDBY (atenuado). El panel con foco recupera la intensidad vía body.fp-*. */
  .mtile.sel{border-color:var(--ink-3);box-shadow:0 0 0 1px var(--ink-3);}
  body.fp-media .mtile.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  /* media grid (square tiles) + folder navigation */
  .mediagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;padding:7px;align-content:start;border:1px solid transparent;border-radius:4px;}
  .mediagrid.dragover{border-color:rgba(201,205,211,0.5);background:rgba(201,205,211,0.06);}
  .mtile.folderhdr.dragover,.mtile.backtile.dragover{border-color:var(--ink-2);box-shadow:0 0 0 2px rgba(201,205,211,0.35);}
  .mtile{position:relative;border-radius:3px;overflow:hidden;cursor:grab;background:var(--bg-2);border:.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;transition:border-color .12s;}
  .mtile:hover{border-color:rgba(201,205,211,0.45);}
  .mtile.missing{box-shadow:inset 0 0 0 1px #E06A6A;} /* [M4] missing original → red */
  .mtile .tthumb{aspect-ratio:1;background-size:cover;background-position:center;background-color:var(--bg-1);position:relative;}
  .mtile .tthumb.mseq{outline:1.5px solid var(--state-on);outline-offset:-1.5px;}
  .mtile .tdur{position:absolute;right:2px;bottom:2px;font:9px Geist;background:rgba(0,0,0,0.62);color:var(--ink-2);padding:0 3px;border-radius:2px;}
  .mtile .tprox{position:absolute;left:2px;top:2px;font-size:11px;}
  .mtile .tpbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(0,0,0,0.5);} .mtile .tpbar>i{display:block;height:100%;background:var(--ink-2);}
  .mtile .tlbl{font-size:11px;line-height:1.25;color:var(--ink-2);padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mtile.foldertile,.mtile.backtile{cursor:pointer;background:var(--surface);}
  .mthumb{width:50px;height:30px;flex-shrink:0;border-radius:2px;background-size:cover;background-position:center;border:.5px solid rgba(255,255,255,0.09);position:relative;overflow:hidden;background-color:var(--surface-2);}
  .mthumb .dur{position:absolute;bottom:2px;right:3px;font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink);background:rgba(0,0,0,0.55);padding:0 3px;border-radius:2px;}
  .mthumb .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,0.4);}
  .mthumb .pbar>i{display:block;height:100%;width:0;background:var(--ink-2);}
  /* [R109] proxy generating: taller cyan bar + centred % so a long encode reads unmistakably as "working, N%" */
  .mthumb .pbar.gen{height:14px;background:rgba(6,7,9,0.74);}
  .mthumb .pbar.gen>i{background:var(--auto-live);transition:width .2s linear;}
  .mthumb .pbar .pbtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 9px Geist,system-ui,sans-serif;color:var(--ink);letter-spacing:.03em;pointer-events:none;}
  .mname{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mmeta{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.04em;} /* [AUDITORÍA Rev1] 11→10px: el uppercase SÍ es del diseño, pero sólo a 10px (micro-metadata, RevDomo:275) */
  .mdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .drop{margin:8px;border:1px dashed rgba(255,255,255,0.12);border-radius:2px;padding:18px 10px;text-align:center;color:var(--ink-faint);cursor:pointer;font-size:11px;line-height:1.6;}
  .drop:hover{border-color:var(--ink-2);color:var(--ink-2);} .drop b{color:var(--ink-2);}

  /* viewport */
  main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-1);position:relative;overflow:hidden;}
  .vptool{height:28px;flex-shrink:0;display:flex;align-items:center;gap:var(--sp-8);padding:0 8px;background:var(--surface);border-bottom:.5px solid rgba(0,0,0,0.35);overflow:hidden;}
  /* [REDISEÑO Rev1] los grupos del visor son "wells" hundidos (segmentado 22px, botones 16px, sin divisores internos) */

  /* [R152 · §3] botón "More" de la barra del visor (28×22, prototipo RevDomo:180) */
  /* [R157] hueco de cámara: ancho fijo para que Orbit↔Viewer no mueva nada de lo que persiste a su derecha */

  .vdiv{width:.5px;height:16px;background:rgba(255,255,255,0.08);flex-shrink:0;}
  .vslab{display:inline-flex;align-items:center;gap:6px;height:18px;padding:0 7px;border-radius:2px;background:var(--surface-2);border-top:.5px solid rgba(255,255,255,0.05);border-bottom:.5px solid rgba(0,0,0,0.3);}
  .vslab .k{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:0.08em;color:var(--ink-faint);}
  .vslab .v{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink);}
  /* [T4] camera faders (FOV/DOLLY/DIST) — crisp monochrome track+fill+thumb replacing the raw native accent-color slider.
     Value reads by LIGHTNESS (light-gray fill on the recessed --s0 groove), per the app's Resolve/Blender colour contract. */
  .vslab input[type=range].vfader{-webkit-appearance:none;appearance:none;width:74px;height:14px;background:transparent;cursor:ew-resize;margin:0;vertical-align:middle;}
  .vslab input[type=range].vfader:focus{outline:none;}
  .vslab input[type=range].vfader::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ink-2) 0 var(--pct,50%),var(--s0) var(--pct,50%) 100%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,0.06),inset 0 1px 1px rgba(0,0,0,0.5);}
  .vslab input[type=range].vfader::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:11px;margin-top:-3.5px;border-radius:50%;background:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.55),0 0 0 .5px rgba(0,0,0,0.45);transition:transform .12s cubic-bezier(0.22,1,0.36,1),box-shadow .12s;}
  .vslab input[type=range].vfader:hover::-webkit-slider-thumb{transform:scale(1.15);}
  .vslab input[type=range].vfader:active::-webkit-slider-thumb{transform:scale(1.06);box-shadow:0 0 0 3px rgba(201,205,211,0.22),0 1px 2px rgba(0,0,0,0.55);}
  .vslab input[type=range].vfader:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(201,205,211,0.30);}
  .vslab input[type=range].vfader::-moz-range-track{height:4px;border-radius:2px;background:var(--s0);box-shadow:inset 0 0 0 .5px rgba(255,255,255,0.06);}
  .vslab input[type=range].vfader::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink-2);}
  .vslab input[type=range].vfader::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.55);}
  @media (prefers-reduced-motion: reduce){ .vslab input[type=range].vfader::-webkit-slider-thumb{transition:none;} }
  .stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#000;}
  /* [V2] Full Performance: the viewer takes over the whole window; everything else stays in the DOM, just covered */
  body.perfmode #stage{position:fixed !important;inset:0 !important;z-index:1000 !important;}
  .perfexit{display:none;position:absolute;top:12px;right:14px;z-index:1001;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:4px;background:rgba(18,20,24,0.70);color:var(--ink-2);font-size:11px;cursor:pointer;border:.5px solid rgba(255,255,255,0.16);}
  .perfexit:hover{color:var(--ink);background:rgba(28,31,36,0.85);}
  body.perfmode #perfExit{display:flex;}
  body.perfmode #perfExit:not(:hover){opacity:0.25;transition:opacity .2s;}
  /* [F8] alpha-reference checkerboard behind the (transparent) GL canvas */
  .checkerbg{position:absolute;inset:0;z-index:0;display:none;background-color:#ffffff;background-image:linear-gradient(45deg,#bfbfbf 25%,transparent 25%,transparent 75%,#bfbfbf 75%),linear-gradient(45deg,#bfbfbf 25%,transparent 25%,transparent 75%,#bfbfbf 75%);background-size:26px 26px;background-position:0 0,13px 13px;}
  .checkerbg.on{display:block;}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* [R2] while exporting, glc is resized to the export resolution → the on-screen canvas would show a stretched
     stale frame. This opaque mask hides that; the export still reads from #gl underneath. */
  .rendermask{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:var(--s0);}
  .rendermask.on{display:flex;}
  .rendermask .rmlabel{display:flex;align-items:center;gap:9px;color:var(--ink-2);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;}
  .rendermask .rmdot{width:8px;height:8px;border-radius:50%;background:var(--auto-live);animation:rmpulse 1s ease-in-out infinite;}
  @keyframes rmpulse{0%,100%{opacity:0.25;transform:scale(0.8);}50%{opacity:1;transform:scale(1);}}
  #grid{pointer-events:auto;}

  /* inspector */
  .insbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
  .selhead{display:flex;align-items:center;gap:12px;padding:10px 12px;}
  .selthumb{width:44px;height:29px;border-radius:2px;background-size:cover;background-position:center;border:.5px solid rgba(255,255,255,0.14);background-color:var(--surface-2);}
  .selname{font-size:13px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .selmeta{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:10px;letter-spacing:0.04em;color:var(--ink-2);margin-top:2px;text-transform:uppercase;} /* [AUDITORÍA Rev1] 11→10px (RevDomo:275 — el uppercase se tolera SÓLO a este tamaño) */ /* [R92-T5] informational text lifted to ~4.5:1 (long dark-room sessions) */
  .sechead{width:100%;display:flex;align-items:center;gap:6px;height:24px;padding:0 12px;border:none;background:transparent;cursor:pointer;} /* [AUDITORÍA R154] 20→24px (RevDomo:278) */
  .fxhdr .fxtog,.fxhdr .fxcol,.fxhdr .fxdel{background:none;border:none;} .fxhdr .fxtog:hover,.fxhdr .fxcol:hover,.fxhdr .fxdel:hover{background:var(--surface-3);} .fxhdr .fxdel:hover{color:var(--ink-2) !important;}
  /* [X2] reactive-FX card body: grouped into labelled sections (Routing / Response / Parameters) so each effect box reads as ordered blocks, not a flat stack */
  .fxbody{padding:5px 8px 7px;display:flex;flex-direction:column;gap:4px;}
  .fxseg{display:flex;gap:4px;margin-bottom:1px;}
  .fxsec{font-family:'Geist',system-ui,sans-serif;font-size:8.5px;font-weight:600;letter-spacing:0.02em;color:var(--ink-3);padding:5px 1px 1px;user-select:none;} /* [Rev1] sin uppercase */
  .fxsec:first-child{padding-top:1px;}
  .aselect{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%239EA5AD' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 4px center;padding-right:15px;}
  .sechead .t{font-family:'Geist',system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:-0.005em;color:var(--ink);} /* [Rev1] Title Case, no uppercase (design §4) */
  .sechead .ln{flex:1;height:.5px;background:rgba(255,255,255,0.09);}
  /* [archivado 20260725] CSS de #insMaster (Master Grade) → _backup/deprecated/20260725-master-grade-engine.js */
  /* [R102·D-T3] 24px de alto de fila: los controles de 20px en filas de 22px quedaban a 23px de centro a centro VERTICALMENTE (no entre ellos: entre filas). SC 2.5.8 AA pide 24. Nota: Blender envia 20px + buttonspacey 2 = paso 22, o sea que incumpliria la norma AA de 2023 — la norma es posterior a su diseno. Preferimos la norma. */
  .prow{display:flex;align-items:center;gap:var(--sp-8);padding:1px 12px;min-height:24px;border-bottom:.5px solid rgba(255,255,255,0.04);}
  .prow .kf{width:20px;height:20px;flex-shrink:0;display:grid;place-items:center;border:none;background:transparent;cursor:pointer;color:var(--ink-faint);}
  .prow .kf.on{color:var(--ink);}
  .prow .kf:not([data-kf]){display:none;} /* [A1] the per-row stopwatch is gone — collapse the leftover empty .kf spacer spans so labels left-align; the functional Reactive-FX keyframe toggle (.kf[data-kf]) stays visible */
  .prow .reEn{width:18px;height:18px;flex-shrink:0;display:none;place-items:center;border:.5px solid rgba(255,255,255,0.25);border-radius:2px;background:transparent;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1;padding:0;}
  .prow .reEn:hover{background:rgba(255,255,255,0.1);}
  .prow .lab{width:60px;flex-shrink:0;font-size:11px;color:var(--ink-2);}
  .prow.auto .lab{color:var(--ink);font-weight:500;} /* param carries automation (Ableton-style highlight) */
  .prow .field{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;height:20px;cursor:ew-resize;}
  .prow .track{flex:1;height:3px;border-radius:2px;background:var(--bg-0);box-shadow:inset 0 1px 2px rgba(0,0,0,0.55);position:relative;overflow:hidden;}
  .prow .track>i{position:absolute;left:0;top:0;bottom:0;background:var(--pc,#FFFFFF);} /* [REDISEÑO Rev1] relleno del fader en el hue del parámetro (--pc = autoColor(p)) */
  .prow.auto .nav button[data-k=add]{color:var(--pc);} /* diamante de keyframe en el hue del parámetro cuando está automatizado */
  /* [R102·D-T3] Un valor arrastrable ES un campo editable → superficie s0 (más OSCURA que el panel), no s2.
     Antes era s2, o sea idéntico a un botón: dos comportamientos con la misma pinta.
     La regla investigada decía "reserva UN acento saturado para lo arrastrable" (Blender: `wcol_num.item`
     #4772b3, el relleno del deslizador — el único acento de todo su set de widgets). NO se aplica aquí: nuestro
     presupuesto de 2 acentos ya está gastado a propósito en el estado de automatización (cian = vivo, ámbar =
     anulado), que es lo que nos diferencia. Gastar un tercero rompería la regla escrita en :root. La dirección
     del contraste hace el mismo trabajo y es gratis. */
  .prow .box{min-width:42px;display:flex;align-items:baseline;justify-content:flex-end;gap:2px;height:16px;padding:0 5px;border-radius:2px;background:var(--s0);}
  .prow .box .num{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink);}
  .prow .box .u{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink-2);}
  .prow .box input.numedit{width:44px;background:var(--bg-0);border:.5px solid var(--ink-2);border-radius:2px;outline:none;color:var(--ink);font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:11px;text-align:right;padding:0 3px;box-shadow:0 0 0 2px rgba(201,205,211,0.22);}
  .prow .nav{display:flex;align-items:center;flex-shrink:0;gap:var(--sp-4);}
  /* [R102·D-T3] 20×20 (altura de control de Blender) + gap 4 → paso 24 = SC 2.5.8 AA. Antes: 15×18 pegados,

  .prow .nav button{width:20px;height:20px;display:grid;place-items:center;border:none;background:transparent;cursor:pointer;color:var(--ink-faint);}
  .prow .nav button:hover{color:var(--ink-2);}

  .togbtn,.togbtn2{display:inline-flex;align-items:center;gap:var(--sp-6);height:20px;padding:0 9px;font-size:11px;font-weight:500;border-radius:3px;cursor:pointer;border:.5px solid rgba(255,255,255,0.09);background:var(--surface-2);color:var(--ink-2);} /* [U-18] .togbtn2 was a value-by-value clone */

  .editseg{height:22px;padding:2px;gap:2px;box-sizing:border-box;overflow:visible;background:var(--s2);}

  /* [R93] Ableton chooser pair (device + parameter): lives in the TRACK HEADER (.autoctl) and in each sub-lane header */

  .lanehdr .autoctl .abt.ovr,.autohdr .abt.ovr{color:#E5B567;border-color:rgba(229,181,103,0.55);} /* [R94-UT2·U-16] amber = automation overridden (Ableton-style), vs white "on" = following the curve */

  .trackdivider{height:18px;flex-shrink:0;background:var(--bg-0);border-top:1px solid rgba(255,255,255,0.14);border-bottom:1px solid rgba(255,255,255,0.14);box-shadow:inset 0 0 0 100px rgba(0,0,0,0.35);} /* [R110] taller so the AUDIO/VIDEO group labels sit comfortably */
  .trackdivider.resizable{cursor:row-resize;} .trackdivider.resizable:hover{background:var(--s0);border-top-color:rgba(201,205,211,0.55);border-bottom-color:rgba(201,205,211,0.55);}
  .trackdivider.collapsible{cursor:pointer;} .trackdivider.collapsible:hover{background:var(--s0);border-top-color:rgba(201,205,211,0.45);border-bottom-color:rgba(201,205,211,0.45);} /* [R110] the AUDIO bar toggles the module collapse */
  .trackdivider.hdr{display:flex;align-items:center;gap:5px;padding:0 10px;}
  .trackdivider.hdr .dvlab,.rulerpad .dvlab{font-family:'Geist',system-ui,sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint);} /* [U1] VIDEO (ruler-pad) matches the AUDIO bar label style */
  .trackdivider.hdr .dvchev{font-size:9px;color:var(--ink-3);line-height:1;}
  /* [R156] el audio se comporta como el vídeo: SÍ colapsa (triángulo) — la regla de R110 que se lo quitaba
     junto con el resize ya no aplica, porque el resize por pista no existe para nadie. */
  /* [R92-T9] pinned audio module — video tracks scroll behind it (Premiere) */
  .audiozone{position:sticky;bottom:0;z-index:4;margin-top:auto;background:var(--bg-1);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;} /* [R93b] fixed-height module: extra audio tracks scroll INSIDE (wheel); no visible scrollbar · [L2] margin-top:auto pins it to the bottom when there's free space, sticky handles the overflow case */
  .audiozone::-webkit-scrollbar{display:none;}
  .audiozone.covers{box-shadow:0 -8px 12px -6px rgba(0,0,0,0.55);} /* [R94-UT2·U-01] top shadow = video rows are hidden behind the pinned module */
  .audiozone.hdr{background:var(--surface);z-index:6;}
  .audiozone .trackdivider{position:sticky;top:0;z-index:7;} /* the divider (resize grip) stays pinned at the top of the module while its content scrolls */
  .clip{position:absolute;top:4px;border-radius:2px;overflow:hidden;cursor:default;background:transparent;border:1px solid rgba(255,255,255,0.10);}
  .clip .fill{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42;}
  .clip .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.05),rgba(0,0,0,0.22));}
  .clip .cthumb{position:absolute;left:0;top:15px;bottom:0;background-size:cover;background-position:center;border-right:1px solid rgba(0,0,0,0.45);pointer-events:none;z-index:1;} /* [R94b] Premiere-style head thumbnail, fixed at the clip's left edge */
  body.automode .clip .cthumb{display:none;} /* automation mode: the clip body is the envelope canvas — no thumbnail */
  .lane.collapsed .clip .cthumb{display:none;}
  .clip .tt{position:absolute;left:0;right:0;top:0;height:16px;line-height:15px;padding:0 7px;font-size:11px;font-weight:600;color:var(--ink);text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--s2);border-bottom:.5px solid rgba(0,0,0,0.25);cursor:grab;pointer-events:auto;z-index:2;}
  /* [R102·D-T2] Base = standby (foco en otro panel). body.fp-timeline la sube a selección plena. */
  .clip .tt:active{cursor:grabbing;} .clip.sel .tt{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.30);}
  body.fp-timeline .clip.sel .tt{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.85);}
  /* [R102·D-T2] Clip deshabilitado: atenuado Y con trama. El color nunca puede ser el único portador del
     estado — la trama es forma, se lee en escala de grises y con cualquier daltonismo. */
  .clip.offline{border-color:#E06A6A;box-shadow:inset 0 0 0 1px rgba(224,106,106,0.55);} /* [M4] clip whose media was deleted/is missing */
  .clip.off{opacity:.42;filter:saturate(0.25);}
  .clip.off::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:2px;
    background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,0.5) 4px 8px);}
  /* [T5] pista silenciada: sigue CLARAMENTE visible (opacidad alta, sin trama) — a diferencia de disabled — y se marca con una chapa de altavoz-mute (signo de forma, daltonismo-safe). */
  .clip.muted{opacity:.82;filter:saturate(0.7);}
  .clip.muted .mutebadge{position:absolute;top:3px;left:4px;width:16px;height:16px;border-radius:50%;
    background:rgba(11,13,16,0.68);color:var(--ink-2);display:flex;align-items:center;justify-content:center;
    z-index:4;pointer-events:none;box-shadow:0 0 0 .5px rgba(255,255,255,0.2);}
  /* [R94-UT2·U-09] automation mode: the clip body is the envelope canvas — highlight the title band as the ONLY grab zone */
  body.automode .clip .tt{cursor:grab;box-shadow:inset 0 -1px 0 rgba(255,255,255,0.28);}
  /* [R95·E3] with automation on, the material steps back so the envelope is the subject (Ableton dims the waveform) */
  body.automode .clip .fill{opacity:.35;} body.automode .clip .cthumb{opacity:.3;} body.automode .clip .scrim{opacity:.5;}
  /* [R94c] Simple clip view (Premiere): the whole block grabs — the title band stops being the only handle */
  /* [R155] `simpleclips` ya no es un modo conmutable: se fija al arrancar y es el único agarre (Premiere). */
  body.simpleclips .clip{cursor:grab;} body.simpleclips .clip:active{cursor:grabbing;}
  body.simpleclips .clip .tt{box-shadow:none;}
  body.automode .clip .tt:active{cursor:grabbing;}
  body.automode .clip.sel .tt{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.7),inset 0 -1px 0 rgba(255,255,255,0.28);}
  /* [R171] La fuente va JUNTO AL NOMBRE dentro del título, en gris y con peso normal: antes era una chapa en
     mayúsculas flotando sobre el clip, que competía con el nombre y tapaba la miniatura. */
  .clip .tt .cpx{margin-left:6px;font-weight:400;font-size:10px;color:var(--ink-3);opacity:.85;}
  .clip .tt .cnc{padding:0 4px;border-radius:2px;background:rgba(255,255,255,0.16);color:var(--ink);opacity:1;}
  .clip .tt .cnc.stale{background:rgba(224,96,96,0.85);color:#fff;font-weight:600;}
  .clip .tt .cnc.offsw{background:transparent;border:1px solid rgba(255,255,255,0.28);color:var(--ink-3);}
  .clip .cpxbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,0.45);pointer-events:none;}
  .clip .cpxbar>i{display:block;height:100%;background:var(--ink-2);}
  /* [R102·D-T2] ESTA es la señal de selección que siempre se ve: el borde del clip entero. (El contorno del
     título de arriba no vale como señal única — `body.simpleclips` lo anula a propósito, porque en modo simple
     el título deja de ser el asa, y el modo simple es el de por defecto.)
     Base = STANDBY: seleccionado, pero el foco está en otro panel. body.fp-timeline lo sube a selección plena. */
  .clip.sel{border:1.5px solid var(--ink-3);box-shadow:0 0 0 1px var(--ink-3);}
  body.fp-timeline .clip.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  .clip .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2;}
  .clip .hd.l{left:0;} .clip .hd.r{right:0;}
  .clip .hd:hover{background:rgba(201,205,211,0.25);}
  /* [R132] Ableton automation view: in automation mode the clip resizes ONLY from the top strip (top-left/right corners, aligned with RES_TOP=15px). The rest of the L/R edges is freed so envelope breakpoints can be placed right up to the clip boundary. */
  body.automode .clip .hd{bottom:auto;height:15px;}
  body.automode .clip .hd:hover{background:rgba(201,205,211,0.38);}
  .clip .fadeh{position:absolute;top:0;width:11px;height:11px;z-index:4;cursor:ew-resize;}
  .clip .fadeh::after{content:'';position:absolute;top:3px;width:6px;height:6px;border-radius:1px;background:rgba(255,255,255,0.35);} /* [Rev1] cuadradito en la esquina superior (diseño §6) en vez de círculo */
  .clip .fadeh.fadeL{transform:translateX(-50%);} .clip .fadeh.fadeL::after{left:1px;}
  .clip .fadeh.fadeR{transform:translateX(50%);} .clip .fadeh.fadeR::after{right:1px;}
  .clip .fadeh:hover::after{background:var(--ink-2);}
  /* [R155] En modo automatización el cuerpo del clip ES la curva: los cuadraditos de fade viven en la misma
     esquina superior donde se agarran los keyframes, así que arrastrar uno era una lotería. Se ocultan; el fade
     se sigue editando desde el inspector (Clip · Fade in / Fade out) y volviendo a modo normal. */
  body.automode .clip .fadeh{display:none;pointer-events:none;}
  .xfade{position:absolute;top:4px;bottom:4px;z-index:3;pointer-events:none;background-color:rgba(201,205,211,0.10);background-image:linear-gradient(to top right,transparent 48%,rgba(201,205,211,0.55) 50%,transparent 52%),linear-gradient(to bottom right,transparent 48%,rgba(201,205,211,0.55) 50%,transparent 52%);}
  .clip .fadeenv{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:visible;}
  .clip .fadeenv polyline{fill:none;stroke:var(--ink-2);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.92;}
  .clip .kfstrip{position:absolute;left:0;right:0;bottom:0;height:9px;pointer-events:none;z-index:2;}
  .clip .kfd{position:absolute;bottom:1px;width:7px;height:7px;background:var(--ink-2);transform:translateX(-50%) rotate(45deg);border:.5px solid var(--bg-1);pointer-events:auto;cursor:pointer;}
  .clip .kfstrip.dim{opacity:.32;} .clip .kfstrip.dim .kfd{pointer-events:none;width:5px;height:5px;} /* [R92-T4] passive automation hint on unselected clips */
  .playhead{position:absolute;top:22px;width:2px;background:var(--ink);z-index:6;pointer-events:none;} /* [R94f] starts BELOW the ruler: the head is the top cap, the line no longer runs through it. Height set in renderTimeline = all tracks */
  /* [R94d] Premiere-style playhead head: a flat-topped shield (square shoulders + tapered tip) sitting in the ruler, not an arrow over the tracks */
  #phTri{position:absolute;top:12px;width:11px;height:10px;background:var(--ink);transform:translateX(-4.5px);pointer-events:none;z-index:6;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);border-radius:1px 1px 0 0;} /* [R94f] −15%; its tip lands exactly where the ruler ends and the line begins */
  .snapline{position:absolute;top:0;width:1px;background:var(--ink);z-index:7;pointer-events:none;display:none;} /* crisp 1px line, no glow (R82: the blurred glow read as a stray thick line) — height set in renderTimeline = ruler + all tracks */
  .snapline.free{opacity:0.5;width:1px;} /* razor hover preview (not snapped) */
  /* timeline-header sequence tabs (Premiere-style) */
  .seqtabs{display:flex;gap:4px;align-items:center;padding:4px 8px;background:var(--s0);border-bottom:.5px solid rgba(0,0,0,0.45);overflow-x:auto;overflow-y:hidden;flex-shrink:0;scrollbar-width:thin;}
  .seqtabs::-webkit-scrollbar{height:6px;} .seqtabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:2px;}
  /* [R105] height:20px explícito → todas las pestañas Y el botón "+" quedan a 20 (la altura de control de
     Blender y de la escala {16,18,20,22,24}). Antes el "+" salía a 21 por su font-weight:700: 1px más alto que
     las pestañas hermanas — el accidente que anoté en R102·D-T3. */
  .seqtab{display:inline-flex;align-items:center;height:20px;font-size:11px;padding:0 7px 0 9px;border-radius:2px;background:var(--surface);border:.5px solid rgba(255,255,255,0.1);color:var(--ink-2);cursor:pointer;white-space:nowrap;flex-shrink:0;box-sizing:border-box;}
  .seqtab .seqlab{max-width:150px;overflow:hidden;text-overflow:ellipsis;}
  .seqtab.on{background:var(--state-on);color:var(--ink);border-color:var(--ink-2);}
  .seqtab .seqx{margin:-4px -5px -4px 3px;opacity:.45;font-size:11px;line-height:1;padding:6px;border-radius:2px;} /* [U-20] ≥18px clickable area via padding; negative margins keep the tab size */
  .seqtab .seqx:hover{opacity:1;color:var(--ink);background:rgba(255,255,255,0.15);}
  .seqtab.seqadd{color:var(--ink-2);font-weight:700;padding:0 9px;border-radius:2px;border-style:dashed;}
  .seqtab.seqadd:hover{color:var(--ink);border-color:var(--ink-2);}
  /* [REDISEÑO Rev1] #seqTabs como well compacto dentro del transport (misma barra del play) */
  .transport .seqtabs{padding:2px;height:22px;box-sizing:border-box;gap:2px;background:var(--surface-2);border:.5px solid rgba(255,255,255,0.1);border-radius:3px;border-bottom:.5px solid rgba(255,255,255,0.1);max-width:36%;flex-shrink:1;overflow-x:auto;}
  .transport .seqtabs::-webkit-scrollbar{height:0;}
  .transport .seqtab{height:16px;padding:0 8px;border-radius:2px;background:transparent;border:none;}
  .transport .seqtab.on{background:var(--state-on);color:var(--ink);border:none;}
  .transport .seqtab.seqadd{padding:0 7px;border:none;color:var(--ink-2);}
  .mthumb.mseq{background:linear-gradient(135deg,var(--s2),var(--s1));display:flex;align-items:center;justify-content:center;}
  .cmini{display:flex;flex-direction:column;gap:var(--sp-4);flex:1;min-width:58px;font-size:11px;color:var(--ink-2);}
  .cmini input{height:20px;background:var(--surface-2);border:.5px solid rgba(255,255,255,0.12);border-radius:2px;color:var(--ink);text-align:center;font-size:11px;font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  #cPrev,#icPrev{background:var(--s0);border:.5px solid rgba(255,255,255,0.12);}
  .cmedialist{flex:1;min-width:0;max-height:84px;overflow-y:auto;background:var(--s0);border:.5px solid rgba(255,255,255,0.12);border-radius:2px;padding:3px;display:flex;flex-direction:column;gap:var(--sp-2);}
  .cmedialist::-webkit-scrollbar{width:7px;} .cmedialist::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:2px;}
  .cmediaitem{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:2px;cursor:pointer;font-size:11px;color:var(--ink-2);min-width:0;}
  .cmediaitem:hover{background:rgba(255,255,255,0.05);}
  .cmediaitem input{flex-shrink:0;margin:0;} .cmediaitem .mdot{width:8px;height:8px;border-radius:50%;}
  .cmediaitem .cmname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}

  /* status bar */
  /* [AUDITORÍA Rev1 · §7] 24→22px, superficie de panel (#1B1B1B) y borde superior claro, como el prototipo.
     DESVIACIÓN DELIBERADA: el prototipo pinta el texto en #8C8C8C (--ink-3); lo dejamos en --ink-2 porque el
     token dice explícitamente que #8C8C8C "NO es texto de cuerpo" (Lc −38) y R102 ya subió los textos que
     estaban ahí. Si Beltrán prefiere la fidelidad al prototipo, es cambiar --ink-2 por --ink-3 acá. */
  .status{height:22px;flex-shrink:0;display:flex;align-items:center;gap:var(--sp-16);padding:0 12px;background:var(--surface);border-top:.5px solid rgba(255,255,255,0.07);font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--ink-2);letter-spacing:0.04em;}
  .status .ok{color:var(--ink-2);}

  /* modals */
  .overlay{position:fixed;inset:0;background:rgba(6,7,9,0.66);display:flex;align-items:center;justify-content:center;z-index:50;animation:overIn .12s;}
  /* [R134] branded square splash — the 1080×1080 logo loop shown a couple of seconds on startup + project open (responsive, capped at the native 1080²) */
  /* [archivado 20260725] CSS del splash dentro del documento → _backup/deprecated/20260725-in-page-splash.js
     (el splash ahora es splash.html, en su propia ventana de 1080²) */

  /* ============================================================================================================
     LAUNCHER (pantalla de inicio) — recreado del handoff "Launcher - Rev 4.dc.html".
     El prototipo lleva todo en estilos inline; acá va en clases `lch-*` porque el markup lo arma `renderLauncher()`
     y con inline sería ilegible. Los valores (alturas, radios, colores, tipografías) son los del handoff.
     NOTA: el launcher NO usa los tokens del editor. El diseño trae su propia paleta (canvas #0A0B0C, panel #101113,
     pozo #0C0D0F, barra #121316) que no coincide con s0/s1/s2, y mezclarlas daría un gris a medio camino.
     ============================================================================================================ */
  #landingOv.lch{display:block;padding:0;background:var(--s0);align-items:stretch;justify-content:flex-start;}
  .lch *{box-sizing:border-box;}
  .lch-wrap{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;font-family:'Geist',system-ui,sans-serif;color:var(--ink);}
  .lch-top{height:38px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 24px;border-bottom:.5px solid var(--line-soft);background:rgba(17,17,17,0.6);}
  .lch-top .nm{font-size:11px;font-weight:600;letter-spacing:-0.008em;color:var(--ink-2);}
  .lch-top .ver{font-size:10px;color:var(--ink-dim);font-variant-numeric:tabular-nums;letter-spacing:0.04em;margin-left:2px;}
  .lch-tbtn{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:3px;border:.5px solid var(--line);background:transparent;color:var(--ink-2);font-family:inherit;font-size:10.5px;font-weight:500;cursor:pointer;}
  .lch-tbtn:hover{border-color:var(--line-strong);color:var(--ink);}
  .lch-tico{display:grid;place-items:center;width:22px;height:22px;padding:0;border-radius:3px;border:.5px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;}
  .lch-tico:hover{border-color:var(--line-strong);color:var(--ink);}
  .lch-mid{flex:1;display:flex;justify-content:center;min-height:0;padding:0 28px 22px;}
  .lch-col{width:100%;max-width:1760px;display:flex;flex-direction:column;min-height:0;}
  .lch-hero{display:flex;align-items:center;gap:20px;padding:22px 2px 18px;flex-shrink:0;}
  .lch-hero h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-0.026em;line-height:1;color:var(--ink);}
  .lch-alma{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 9px;border:.5px solid var(--line-soft);border-radius:4px;background:rgba(255,255,255,0.015);flex-shrink:0;}
  .lch-alma .k{font-size:9.5px;font-weight:500;letter-spacing:0.05em;color:var(--ink-dim);}
  .lch-alma .v{font-size:11.5px;font-weight:600;letter-spacing:-0.006em;color:var(--ink-2);}
  /* Requisito duro del handoff: alto idéntico para los tres tipos, la página no scrollea nunca */
  /* [R181] el suelo era 612px fijos: a 900px de ventana el bloque + héroe + recientes no cabían y la página
     scrolleaba, cortando los recientes. El contrato del launcher es que NO scrollee NUNCA, así que el visor
     cede altura primero. El alto sigue siendo idéntico en los tres formatos, que es lo que pedía el handoff. */
  .lch-work{flex:1;min-height:380px;max-height:720px;display:grid;grid-template-columns:426px minmax(0,1fr);gap:16px;}
  .lch-panel{display:flex;flex-direction:column;gap:9px;padding:14px;border:.5px solid var(--line);border-radius:5px;background:var(--s1);overflow:hidden;}
  .lch-seclab{display:flex;align-items:center;gap:8px;}
  .lch-seclab>span:first-child{font-size:10px;font-weight:600;letter-spacing:0.06em;color:var(--ink-3);}
  .lch-rule{flex:1;height:.5px;background:var(--line-soft);}
  .lch-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .lch-tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;height:68px;padding:8px 9px;border-radius:4px;cursor:pointer;font-family:inherit;text-align:left;transition:background .12s,border-color .12s;background:var(--s0);border:.5px solid var(--line-soft);color:var(--ink-3);}
  .lch-tile:hover{border-color:var(--line-strong);}
  .lch-tile.on{background:var(--s2);border:.5px solid var(--line-strong);color:var(--ink);box-shadow:inset 0 1px 0 var(--line-soft);}
  .lch-tile .tn{font-size:11px;font-weight:600;letter-spacing:-0.006em;}
  .lch-tile .ts{font-size:9.5px;font-weight:400;color:var(--ink-3);}
  .lch-row{display:flex;align-items:center;gap:9px;height:22px;}
  .lch-row .lab{width:70px;flex-shrink:0;font-size:11px;color:var(--ink-2);}
  .lch-row .note{flex:1;font-size:11px;color:var(--ink-3);}
  .lch-name{display:flex;align-items:center;gap:10px;height:24px;}
  .lch-name input{flex:1;min-width:0;height:24px;padding:0 8px;border-radius:3px;border:.5px solid var(--line);background:var(--s0);color:var(--ink);font-family:inherit;font-size:11px;font-weight:500;outline:none;}
  .lch-name input:focus{border-color:var(--line-strong);}
  .lch-name input::placeholder{color:var(--ink-dim);}
  .lch-seg{display:inline-flex;align-items:stretch;gap:2px;padding:2px;background:var(--s0);border:.5px solid var(--line);border-radius:3px;}
  .lch-seg button{display:grid;place-items:center;height:16px;padding:0 7px;border:none;border-radius:2px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;background:transparent;color:var(--ink-3);}
  .lch-seg button:hover:not(.on){color:var(--ink-2);}
  .lch-seg button.on{background:var(--ink);color:var(--s0);}

  /* el canvas deja libre la franja de datos: si no, el painter del editor escribe debajo de ella.

  .menu{position:fixed;z-index:60;background:var(--surface);border:.5px solid rgba(255,255,255,0.13);border-radius:2px;box-shadow:0 12px 34px rgba(0,0,0,0.55);padding:4px;min-width:170px;}

  .folderhdr.fsel{background:rgba(201,205,211,0.10);border-color:rgba(201,205,211,0.35);color:var(--ink);} /* selected folder (tree view) — New Folder creates inside it */

  /* composition groups */
  /* [R102·D-T2] ESTADO DERIVADO ≠ ESTADO AFIRMADO. Este clip está resaltado porque su GRUPO está seleccionado,
     no porque lo hayas elegido tú. Ableton tiene `ImplicitArm` justo para esto: una pista armada por
     consecuencia de la selección no se ve igual que una que armaste con el ratón.
     Antes iba en `--ink-2` — MÁS brillante que la selección afirmada en standby (`--ink-3`): lo derivado
     gritaba más que lo afirmado. Y ambos usaban la misma forma, así que sólo los separaba el color.

  .rs-well:focus-within{border-color:var(--line-strong);}
  .rs-well input{flex:1;min-width:0;height:100%;border:none;background:transparent;color:var(--ink);text-align:center;font-family:'Geist',system-ui;font-variant-numeric:tabular-nums;font-size:11px;padding:0 3px;}
  .rs-well .u{color:var(--ink-dim);font-size:9px;padding-right:5px;flex-shrink:0;pointer-events:none;}
  .rs-well.rs-ord{width:40px;justify-self:center;}
  .rs-px{display:flex;align-items:center;gap:5px;} .rs-px .rs-well{flex:1;} .rs-px .x{color:var(--ink-dim);font-size:10px;flex-shrink:0;}
  .grpchip{display:flex;align-items:center;gap:8px;margin:8px 12px;padding:8px 10px;border-radius:2px;background:var(--surface);border:.5px solid rgba(255,255,255,0.14);font-size:11px;color:var(--ink-2);cursor:pointer;}
  .grpchip:hover{background:var(--surface-2);} .grpchip .gc{color:var(--ink-2);display:flex;}
  .grprng{flex:1;accent-color:var(--ink-2);}
  /* hover tooltip (shows ~1s after resting on a tool/button) */
  /* [R94-UT2·U-05] persistent automation grammar next to the Automation button — only while automation mode is on */
  .dsp-tip{position:fixed;z-index:90;pointer-events:none;background:var(--s2);color:var(--ink);border:.5px solid rgba(255,255,255,0.14);border-radius:2px;padding:4px 8px;font-size:11px;font-weight:500;letter-spacing:-0.005em;box-shadow:0 6px 20px rgba(0,0,0,0.5);max-width:260px;white-space:normal;line-height:1.4;opacity:0;transition:opacity .1s;} /* [U-28] long tooltips wrap instead of overflowing */
  .dsp-tip.show{opacity:1;}
  /* [R102·D-T4] Info View: nombre + función de lo que hay bajo el puntero. Instantáneo (el tooltip flotante
     tarda 1s y encima tapa). Posición fija = se lee sin buscarla. */
  .statinfo{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;}
  .statinfo:not(:empty)::before{content:'·';color:var(--ink-dim);margin:0 var(--sp-8) 0 var(--sp-6);}
  .statinfo .k{color:var(--ink);font-weight:500;}          /* el nombre */
  .statinfo .sc{color:var(--ink-3);margin-left:var(--sp-6);}/* el atajo */
  /* Deshabilitado: ámbar. Es el único momento en que el usuario mira aquí, y por tanto el único momento en que
     de verdad quiere aprender — así que es la superficie donde enseñar el atajo que le falta. */
  .statinfo.why{color:var(--auto-ovr);}
  /* [U-17] native <select>s adopt the .aselect look (chevron data-URI + surface chrome). Placed LAST so it wins ties against the per-class size rules above. */
  .selsel,.qsel,.frow select,select.sysel,.asel{appearance:none;-webkit-appearance:none;height:18px;background-color:var(--surface-2);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%239EA5AD' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 4px center;border:.5px solid rgba(255,255,255,0.1);border-radius:2px;color:var(--ink-2);padding:0 15px 0 7px;cursor:pointer;}
</style>
</head>
<body class="preboot">
<div class="app" id="app">
  <!-- TOP BAR -->
  <div class="top">
    <span class="dot"></span>
    <div class="menubar" id="menubar">
      <button class="menubtn" data-menu="file" data-t="menuFile">File</button>
      <button class="menubtn" data-menu="edit" data-t="menuEdit">Edit</button>
      <!-- [R155] configuración del proyecto activo (ángulo del domo, geometría de la sala, preferencias) -->
      <button class="menubtn" data-menu="project" data-t="menuProject">Project</button>
      <button class="menubtn" data-menu="window" data-t="menuWindow">Window</button>
    </div>
    <div style="flex:1;"></div>
    <!-- [REDISEÑO Rev1] top bar: New/Open/Save/Export removidos (van al menú File). Nombre de proyecto + formato + "?" a la derecha. -->
    <span style="font-size:11px;font-weight:600;letter-spacing:-0.008em;color:var(--ink-2);white-space:nowrap;" id="projTitle">Immersive Dome · Show 01</span>
    <span class="tnum" style="font-size:11px;color:var(--ink-dim);cursor:pointer;margin-right:2px;" id="fmtChip" title="Sequence settings">4096² · 60p · PNG</span>
    <button class="tbtn" id="helpBtn" title="All commands &amp; shortcuts · F1" style="font-size:13px;font-weight:600;">?</button>
  </div>

  <div class="bodyrow" id="bodyRow"><div class="stagecol" id="stageCol">
  <!-- MIDDLE -->
  <div class="mid">
    <!-- MEDIA -->
    <aside id="mediaPane" style="width:292px;flex-shrink:0;border-right:.5px solid rgba(255,255,255,0.09);">
      <button class="railexp" id="mediaRail" title="Expand media panel"><i class="ic" data-ico="panelL"></i><span class="rlab">Media</span></button>
      <!-- [REDISEÑO Rev1] header: Media + count · well List/Grid · ocultar -->
      <div class="panhead">
        <div class="pantab"><span style="color:var(--ink-3);display:flex;"><i class="ic" data-ico="folder"></i></span><span class="ttl">Media</span><span class="countbadge" id="mediaCount">0</span></div>
        <div style="flex:1;"></div>
        <div class="well" id="mediaViewSeg">
          <button data-mv="list" class="on" title="List view"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
          <button data-mv="grid" title="Grid view"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
        </div>
        <button class="ibtn flat" id="hideMedia" title="Hide panel"><i class="ic" data-ico="panelL"></i></button>
      </div>
      <!-- [REDISEÑO Rev1] filtros en well (All + Video/Image/Audio) + Sort dropdown (reemplaza None/Folder/Type + búsqueda) -->
      <div class="toolrow" style="height:28px;padding:0 8px;gap:var(--sp-8);">
        <div class="well" id="filtSeg">
          <button data-f="all" class="on">All</button>
          <button data-f="video" title="Video"><i class="ic" data-ico="video"></i></button>
          <button data-f="image" title="Image"><i class="ic" data-ico="image"></i></button>
          <button data-f="audio" title="Audio"><i class="ic" data-ico="audio"></i></button>
        </div>
        <div style="flex:1;" id="filtSpacer"></div>
        <!-- [AUDITORÍA Rev1] la búsqueda no tiene botón (el diseño la sacó de la vista) pero SÍ tiene que existir:
             Ctrl+F revela este campo aquí mismo; Esc lo limpia y lo esconde. Antes apuntaba a un input display:none
             y el atajo era un no-op. -->
        <input id="mediaSearch" class="mediasearch" type="text" placeholder="Search media…" spellcheck="false">
        <button class="ddbtn" id="mediaSortBtn" title="Sort media"><span id="mediaSortLbl">Name</span><span style="display:flex;color:var(--ink-3);"><i class="ic" data-ico="chevDown" data-s="9"></i></span></button>
      </div>
      <!-- [REDISEÑO Rev1] Create row: Import (primario) + Text/Shape/Compose/Adjust · los labels (.crlbl) se colapsan a icono cuando el panel es angosto (container-query) -->
      <div class="toolrow crrow" style="height:28px;padding:0 8px;gap:4px;">
        <button class="crbtn pri" id="importBtn" title="Import media"><i class="ic" data-ico="plus"></i><span class="crlbl">Import</span></button>
        <button class="crbtn" id="textBtn" title="Add text / title"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14"/><path d="M12 6v13"/></svg><span class="crlbl">Text</span></button>
        <button class="crbtn" id="shapeBtn" title="Add shape"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="10" rx="1.5"/></svg><span class="crlbl">Shape</span></button>
        <button class="crbtn" id="ringBtn" title="Create composition (ring / grid / random)"><i class="ic" data-ico="ring"></i><span class="crlbl">Compose</span></button>
        <button class="crbtn" id="adjLayerBtn" title="Create an adjustment layer — its Reactive FX affect everything below it"><i class="ic" data-ico="layers"></i><span class="crlbl">Adjust</span></button>
        <div style="flex:1;"></div>
      </div>
      <button id="newFolderBtn" title="New folder" style="display:none;"></button><!-- oculto: el JS lo usa (clic-derecho en Media → Nueva carpeta) -->
      <div class="medialist" id="mediaList"></div>
      <input id="fileInput" type="file" accept="image/*,video/*,audio/*" multiple style="display:none;">
      <input id="projInput" type="file" accept=".rdome,application/json" style="display:none;">
    </aside>
    <div class="gutter" id="gutterL"></div>

    <!-- VIEWPORT -->
    <main>
      <div class="vptool">
        <div class="vseg" id="viewModeSeg">
          <button data-v="2d" class="on" title="Dome master (2D)"><i class="ic" data-ico="view2d"></i> 2D</button><!-- [U-42] industry term; updModeUI relabels it "2D Master" on flat/room sequences -->
          <button data-v="3d" title="3D preview"><i class="ic" data-ico="view3d"></i> 3D</button>
        </div>
        <div class="vdiv" id="dispSep"></div>
        <!-- [R174] El prototipo las dibuja SOLO ICONO por defecto: su `vpLbl` nace en 'icons' y el rótulo va
             con display:none. El texto sólo aparece en el panel "More", donde sí hace falta leerlo. -->
        <div class="vseg iconly" id="dispSeg">
          <button data-d="grid" class="on" title="Grid overlay"><i class="ic" data-ico="grid"></i><span class="vlbl">Grid</span></button>
          <button data-d="outline" title="Clip outlines"><i class="ic" data-ico="outline"></i><span class="vlbl">Outline</span></button>
          <button data-d="hfade" title="Fade content near the dome horizon (spring line)"><i class="ic" data-ico="cull"></i><span class="vlbl">Horizon</span></button>
          <button data-d="checker" title="Checkerboard background (alpha)"><i class="ic" data-ico="alpha"></i><span class="vlbl">Alpha</span></button><!-- [R164] icono propio, no la rejilla de Grid -->
        </div>
        <div class="vdiv" id="qpSep"></div>
        <div class="vseg" id="qualitySeg" title="Preview quality (does not affect export)">
          <button data-q="1" class="on">Full</button>
          <button data-q="0.5">½</button>
          <button data-q="0.25">¼</button>
        </div>
        <!-- [AUDITORÍA Rev1 · §3] el grupo de cámara 3D va AL FINAL del clúster izquierdo (prototipo RevDomo:154-158),
             no después de #viewModeSeg: así, al aparecer/desaparecer, no empuja overlays ni calidad (antes saltaban +151px). -->
        <div class="vdiv" id="d3sep" style="display:none;"></div>
        <div class="vseg" id="threeModeSeg" style="display:none;">
          <button data-m="orbit" class="on"><i class="ic" data-ico="orbit"></i> Orbit</button>
          <button data-m="spec"><i class="ic" data-ico="viewer"></i> Viewer</button>
        </div>
        <div style="flex:1;"></div>
        <!-- [R157] Hueco de cámara de ancho FIJO. Pedido de Beltrán: al pasar de Orbit a Viewer los botones que
             persisten no se mueven; sólo cambia lo que hay DENTRO de este hueco, y lo nuevo entra por la derecha.
             El ancho es el del caso más ancho (FOV + DOLLY), así que nunca encoge ni empuja. -->
        <div class="camslot" id="camSlot">
        <div class="vslab" id="fovCtl" style="display:none;"><span class="k">FOV</span><input type="range" min="40" max="160" value="60" id="fovRange" class="vfader"><span class="v" id="fovLbl" style="width:26px;text-align:right;">60°</span></div>
        <div class="vslab" id="dollyCtl" hidden data-retirado="R174" style="display:none;"><span class="k">DOLLY</span><input type="range" min="-0.9" max="2.4" step="0.01" value="0.8" id="dollyRange" class="vfader"><span class="v" id="dollyLbl" style="width:26px;text-align:right;">0.8</span></div>
        <div class="vslab" id="distCtl" hidden data-retirado="R174" style="display:none;"><span class="k">DIST</span><input type="range" min="1.2" max="12" step="0.1" value="3" id="distRange" class="vfader"><span class="v" id="distLbl" style="width:26px;text-align:right;">3.0</span></div>
        </div>
        <div class="vseg" id="proxyToggle" title="Viewport uses proxies (faster). Turn off to preview the original clips."><button data-p="proxy" class="on"><i class="ic" data-ico="bolt"></i> Proxy</button></div>
        <div class="vseg" id="nestCacheToggle" title="Compositions play from their proxy (much faster). Turn off to preview them rebuilt from every source clip. The export always rebuilds from sources either way."><button data-p="ncache" class="on"><i class="ic" data-ico="layers"></i> Comp</button></div>
        <div class="vdiv" id="zoomSep"></div>
        <div class="vseg">
          <button id="vzOut" style="width:24px;padding:0;justify-content:center;"><i class="ic" data-ico="zoomOut"></i></button>
          <button id="vzReset" class="tnum" style="width:42px;padding:0;justify-content:center;font-size:11px;">100%</button>
          <button id="vzIn" style="width:24px;padding:0;justify-content:center;"><i class="ic" data-ico="zoomIn"></i></button>
        </div>
        <div class="vdiv" id="outSep"></div>
        <!-- [REDISEÑO Rev1] Output dropdown: consolida Full performance · Viewer window · NDI · Spout en un solo menú -->
        <div class="vseg" id="outWell"><button id="outputBtn" title="Output — Full performance · Viewer window · NDI · Spout" style="position:relative;gap:5px;"><i class="ic" data-ico="ndi"></i>Output<span style="display:flex;opacity:.6;"><i class="ic" data-ico="chevDown" data-s="9"></i></span></button></div>
        <!-- [R152 · §3] "More": cuando la columna del visor se angosta, los grupos se repliegan acá en vez de
             pelear por el espacio (breakpoints del prototipo sobre centerW: Output 440 · overlays 620 · calidad 800
             · Az/El y DIST 980). El menú no duplica lógica: reenvía el clic al control real que quedó oculto. -->
        <button class="vmore" id="vpMoreBtn" title="More viewport controls" style="display:none;">…</button>
      </div>
      <div class="stage" id="stage">
        <div class="checkerbg" id="checkerBg"></div>
        <canvas id="gl"></canvas>
        <canvas id="grid"></canvas>
        <div class="rendermask" id="renderMask"><div class="rmlabel"><span class="rmdot"></span>Rendering…</div></div>
        <button class="perfexit" id="perfExit" title="Exit performance · Esc"><i class="ic" data-ico="panelL"></i> Exit</button>
      </div>
    </main>

    <!-- INSPECTOR -->
    <div class="gutter" id="gutterR"></div>
    <aside id="inspPane" style="width:300px;flex-shrink:0;border-left:.5px solid rgba(255,255,255,0.09);">
      <button class="railexp" id="inspRail" title="Expand inspector"><i class="ic" data-ico="panel"></i><span class="rlab">Inspector</span></button>
      <div class="panhead" id="inspTabs">
        <!-- [REDISEÑO Rev1] tabs Inspector / Reactive FX en un well -->
        <div class="well" style="height:22px;">
          <button class="instab on" data-tab="insp" style="display:inline-flex;align-items:center;gap:5px;"><i class="ic" data-ico="panel"></i><span class="ttl">Inspector</span></button>
          <button class="instab" data-tab="react" style="display:inline-flex;align-items:center;gap:5px;"><i class="ic" data-ico="curves"></i><span class="ttl">Reactive FX</span></button>
        </div>
        <div style="flex:1;"></div>
        <button class="ibtn flat" id="tallInspBtn" title="Full-height inspector column (shrinks the timeline width)"><i class="ic" data-ico="tallpanel"></i></button>
        <button class="ibtn flat" id="hideInsp" title="Collapse panel"><i class="ic" data-ico="panelL"></i></button>
      </div>
      <div class="insbody" id="insBody">
        <!-- [ARCHIVADO] Master Grade fuera del todo: la UI en R148 (master-grade-ui.js) y el MOTOR en R150
             (20260725-master-grade-engine.js). El grado vive por clip en la sección Color. -->
        <div class="insEmpty" id="insEmpty"><span style="opacity:.5;"><i class="ic" data-ico="panel" data-s="26"></i></span>Select a clip<br>in the timeline or viewport</div>
        <div id="insGroup" style="display:none;"></div>
        <div id="insCtl" style="display:none;">
          <div id="selColorBar" title="Clip / track color — click to change" style="height:4px;width:100%;flex-shrink:0;cursor:pointer;background:var(--s2);"></div>
          <div class="selhead"><div class="selthumb" id="selThumb"></div><div style="flex:1;min-width:0;"><div class="selname" id="selName">—</div><div class="selmeta" id="selMeta">—</div></div></div>
          <div id="grpChipHost"></div>
          <button class="sechead" id="secTf" data-sec="tf"><span style="color:var(--ink-dim);display:flex;"><i class="ic" data-ico="chevDown"></i></span><span class="t">Transform</span><span class="ln"></span></button>
          <div id="tfRows"></div>
          <div style="padding:6px 14px;" id="mirrorWrap"><button class="togbtn" id="mirrorBtn"><i class="ic" data-ico="mirror"></i> Mirror</button></div>
          <button class="sechead" id="secFx" data-sec="clip"><span style="color:var(--ink-dim);display:flex;"><i class="ic" data-ico="chevDown"></i></span><span class="t">Clip</span><span class="ln"></span></button>
          <div id="fxRows"></div>
          <!-- [REDISEÑO Rev1] Source (projection/fisheye) y Playback (loop) como secciones propias -->
          <button class="sechead" id="secSource" data-sec="source"><span style="color:var(--ink-dim);display:flex;"><i class="ic" data-ico="chevDown"></i></span><span class="t">Source</span><span class="ln"></span></button>
          <div id="sourceRows"></div>
          <button class="sechead" id="secPlayback" data-sec="playback"><span style="color:var(--ink-dim);display:flex;"><i class="ic" data-ico="chevDown"></i></span><span class="t">Playback</span><span class="ln"></span></button>
          <div id="playbackRows"></div>
          <button class="sechead" id="secColor" data-sec="color"><span style="color:var(--ink-dim);display:flex;"><i class="ic" data-ico="chevDown"></i></span><span class="t">Color</span><span class="ln"></span></button>
          <div id="colorRows"></div>
          <button class="sechead" id="secMotion" data-sec="motion"><span style="color:var(--ink-dim);display:flex;"><i class="ic" data-ico="chevDown"></i></span><span class="t">Motion</span><span class="ln"></span></button>
          <div id="motionRows"></div>
          <div id="insAudio" style="display:none;"></div>
        </div>
        <div id="insReactive" style="display:none;"></div>
      </div>
    </aside>
  </div>

  <!-- TRANSPORT -->
  <div class="transport">
    <!-- [REDISEÑO Rev1] secuencias en la barra del play (zona izquierda, estilo well) -->
    <div class="seqtabs" id="seqTabs"></div>
    <div class="tccenter">
      <button class="tbtn" id="markIn" title="Mark In · I (right-click clears the range)"><i class="ic" data-ico="markIn"></i></button>
      <button class="tbtn" id="toStart" title="Go to start · Home"><i class="ic" data-ico="toStart"></i></button>
      <button class="playb" id="playBtn" title="Play / Pause · Space"><i class="ic" data-ico="play"></i></button>
      <button class="tbtn" id="toEnd" title="Go to end · End"><i class="ic" data-ico="toEnd"></i></button>
      <button class="tbtn" id="markOut" title="Mark Out · O (right-click clears the range)"><i class="ic" data-ico="markOut"></i></button>
      <button class="tbtn" id="followBtn" title="Follow playhead — scroll the timeline during playback"><i class="ic" data-ico="follow"></i></button>
      <div class="tcbox"><span class="tc" id="tc">00:00:00</span><div style="width:.5px;height:14px;background:rgba(255,255,255,0.08);"></div><span class="du" id="bbt" style="font-size:11px;color:var(--ink-2);">0f</span></div>
      <div class="seg2" id="tcModeSeg"><button data-t="timecode" class="on">TC</button><button data-t="frames">Frames</button></div>
      <button class="tbtn" id="loopBtn" title="Loop selection · Ctrl+L"><i class="ic" data-ico="loop"></i></button>
      <div style="display:flex;align-items:center;gap:var(--sp-2);">
        <button class="tbtn" id="addMk" title="Add locator · L" style="width:26px;color:var(--ink-2);"><i class="ic" data-ico="flag"></i></button>
      </div>
    </div>
    <div style="flex:1;"></div>
    <!-- [REDISEÑO Rev1] well de edición: Simple · Auto · Grid · Fit (diseño §5) -->
    <div class="editseg" id="tlEditSeg">
      <button id="curvesBtn" title="Show/hide automation (clip parameters + reactive FX) · A"><i class="ic" data-ico="curves"></i> Auto</button>
      <button id="tlGridBtn" title="Grid — show/hide the timeline grid lines">Grid</button>
      <button id="fitAllBtn" title="Fit the whole timeline to the visible width"><i class="ic" data-ico="fit"></i> Fit</button><!-- [R164] el diseño le pone las cuatro esquinas, como a sus vecinos --><!-- [AUDITORÍA Rev1] el tooltip prometía "(H·W)": fitAll() sólo ajusta el eje horizontal (la altura la da el V-zoom) -->
    </div>
    <div class="zoomgrp"><button id="tlZoomOut" title="Zoom out timeline"><i class="ic" data-ico="zoomOut"></i></button><button id="tlZoomIn" title="Zoom in timeline"><i class="ic" data-ico="zoomIn"></i></button></div>
  </div>

  <!-- TIMELINE -->
  <div class="timeline">
    <div class="hres" id="tlResize" title="Drag to resize the timeline"></div>
    <!-- [REDISEÑO Rev1] #seqTabs movido a la barra del transport (misma barra del play) -->
    <div class="tlmain">
      <div class="toolrail" id="toolRail">
        <button data-t="select" class="on" title="Select (V)"><i class="ic" data-ico="cursor"></i></button>
        <button data-t="trackselect" title="Track Select Forward — click a clip to select it and everything after it (Shift = all tracks)"><i class="ic" data-ico="kfnext"></i></button>
        <button data-t="hand" title="Hand / Pan (H)"><i class="ic" data-ico="hand"></i></button>
        <button data-t="trim" title="Trim (T) — the cursor picks it: edge = ripple · over a cut = roll · title = slide · body = slip"><i class="ic" data-ico="trim"></i></button>
        <button data-t="razor" title="Razor (B)"><i class="ic" data-ico="razor"></i></button>
        <button data-t="zoom" title="Zoom (Z)"><i class="ic" data-ico="zoomIn"></i></button>
      </div>
      <div class="trackhdr" id="trackHdr"><div class="rulerpad"></div><div id="laneHeaders"></div><div id="audioHeadZone" class="audiozone hdr"></div></div>
      <div class="tlscroll" id="tlscroll">
        <div class="ruler" id="ruler"><canvas id="rulerCv"></canvas><div id="clipExtent"></div><div id="phTri"></div></div>
        <div class="work" id="workArea" style="display:none;"><div class="wkbrace" title="Drag to move loop · ends resize"></div><div class="wkh l"></div><div class="wkh r"></div></div>
        <div class="timesel" id="timeSel" style="display:none;"></div>
